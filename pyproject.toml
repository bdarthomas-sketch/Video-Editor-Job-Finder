[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "video-bot"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "python-dotenv",
    "feedparser",
    "colorama",
    "pyfiglet",
]

[tool.setuptools]
py-modules = ["bot", "keywords"]

[project.scripts]
videobot = "bot:main"
